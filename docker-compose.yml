
services:
  postgres:
    image: postgres:15-alpine
    container_name: atlasos-verol-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: atlasos
    ports:
      - "55432:5432"
    volumes:
      - postgres_data_verol:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d atlasos"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    container_name: atlasos-verol-qdrant
    ports:
      - "6335:6333"
      - "6336:6334"
    volumes:
      - qdrant_data_verol:/qdrant/storage
    restart: always

  neo4j:
    image: neo4j:5.12-community
    container_name: atlasos-verol-neo4j
    ports:
      - "7475:7474" # HTTP
      - "7688:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data_verol:/data
      - neo4j_import_verol:/import
      - neo4j_plugins_verol:/plugins
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password123 'RETURN 1'"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: atlasos-verol-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  postgres_data_verol:
  qdrant_data_verol:
  neo4j_data_verol:
  neo4j_import_verol:
  neo4j_plugins_verol:
